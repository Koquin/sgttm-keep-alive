
name: SGTTM Keep Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping na API
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          curl --fail --silent --show-error \
            --max-time 120 \
            "${API_URL%/}/health"
